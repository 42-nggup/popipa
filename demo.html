<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>刷题吧 · 逻辑演示</title>
<!-- 主题要在样式之前定下来，否则深色用户会先闪一下白屏 -->
<script>
try{
  var t = JSON.parse(localStorage.getItem('popipa:theme'));
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
}catch(e){}
</script>
<link rel="stylesheet" href="demo.css">
</head>
<body>

<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="brand"><span class="logo">刷</span><span id="brandName">刷题吧</span></div>
    <div class="who">
      <span class="avatar" id="avatar">?</span>
      <span id="whoName"></span>
      <button class="link" data-act="logout">退出</button>
    </div>
  </div>
</header>

<main class="shell" id="app"><!-- 由 demo.js 渲染 --></main>

<!-- 未提交就切题时的询问框 -->
<div class="mask" id="mask" hidden><div class="dialog" id="dialog"></div></div>

<!-- 主题开关：放在 #app 外面，所以每个页面都在同一个位置 -->
<button class="theme-btn" id="themeBtn" data-act="theme" title="切换深色 / 浅色">☾</button>

<div class="toast" id="toast"></div>

<!-- 数据与逻辑分离：先数据，后逻辑 -->
<script src="demo.data.js"></script>
<script src="demo.js"></script>
</body>
</html>
